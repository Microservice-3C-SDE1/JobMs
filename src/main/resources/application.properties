spring.application.name=JobMs
server.port=8083
spring.cloud.config.import-check.enabled=true
spring.cloud.config.fail-fast=true
spring.config.import=optional:configserver:http://localhost:8087
spring.datasource.url=jdbc:mysql://localhost:3306/jobTest3SDE1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true

# Spring RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest